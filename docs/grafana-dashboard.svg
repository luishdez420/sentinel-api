<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Sentinel API Grafana dashboard preview</title>
  <desc id="desc">A dark Grafana-style dashboard showing request volume, p95 latency, rate limit blocks, error rate, and latency histogram panels.</desc>
  <rect width="960" height="540" fill="#111217"/>
  <rect x="0" y="0" width="960" height="56" fill="#181b1f"/>
  <text x="28" y="36" fill="#f4f5f5" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Sentinel API Observability</text>
  <text x="790" y="35" fill="#9aa4ad" font-family="Inter, Arial, sans-serif" font-size="13">Last 15 minutes</text>

  <g transform="translate(24 80)">
    <rect width="208" height="126" rx="6" fill="#1f232a" stroke="#343a46"/>
    <text x="18" y="30" fill="#aeb6bf" font-family="Inter, Arial, sans-serif" font-size="13">Requests</text>
    <text x="18" y="76" fill="#f4f5f5" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">12.8k</text>
    <polyline points="18,104 54,90 90,98 126,72 162,84 190,62" fill="none" stroke="#73bf69" stroke-width="4"/>
  </g>

  <g transform="translate(256 80)">
    <rect width="208" height="126" rx="6" fill="#1f232a" stroke="#343a46"/>
    <text x="18" y="30" fill="#aeb6bf" font-family="Inter, Arial, sans-serif" font-size="13">p95 Latency</text>
    <text x="18" y="76" fill="#f4f5f5" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">183 ms</text>
    <polyline points="18,96 54,88 90,91 126,78 162,82 190,76" fill="none" stroke="#5794f2" stroke-width="4"/>
  </g>

  <g transform="translate(488 80)">
    <rect width="208" height="126" rx="6" fill="#1f232a" stroke="#343a46"/>
    <text x="18" y="30" fill="#aeb6bf" font-family="Inter, Arial, sans-serif" font-size="13">Rate Limited</text>
    <text x="18" y="76" fill="#f4f5f5" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">42</text>
    <polyline points="18,102 54,102 90,94 126,98 162,72 190,80" fill="none" stroke="#ff9830" stroke-width="4"/>
  </g>

  <g transform="translate(720 80)">
    <rect width="216" height="126" rx="6" fill="#1f232a" stroke="#343a46"/>
    <text x="18" y="30" fill="#aeb6bf" font-family="Inter, Arial, sans-serif" font-size="13">5xx Errors</text>
    <text x="18" y="76" fill="#f4f5f5" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">0.03%</text>
    <polyline points="18,102 54,102 90,102 126,98 162,102 198,100" fill="none" stroke="#f2495c" stroke-width="4"/>
  </g>

  <g transform="translate(24 230)">
    <rect width="444" height="282" rx="6" fill="#1f232a" stroke="#343a46"/>
    <text x="18" y="32" fill="#f4f5f5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Request Latency Histogram</text>
    <line x1="38" y1="238" x2="410" y2="238" stroke="#4b5563"/>
    <line x1="38" y1="58" x2="38" y2="238" stroke="#4b5563"/>
    <g fill="#5794f2">
      <rect x="60" y="158" width="28" height="80"/>
      <rect x="104" y="104" width="28" height="134"/>
      <rect x="148" y="82" width="28" height="156"/>
      <rect x="192" y="118" width="28" height="120"/>
      <rect x="236" y="150" width="28" height="88"/>
      <rect x="280" y="184" width="28" height="54"/>
      <rect x="324" y="208" width="28" height="30"/>
      <rect x="368" y="222" width="28" height="16"/>
    </g>
    <text x="58" y="260" fill="#9aa4ad" font-family="Inter, Arial, sans-serif" font-size="11">5ms</text>
    <text x="142" y="260" fill="#9aa4ad" font-family="Inter, Arial, sans-serif" font-size="11">25ms</text>
    <text x="230" y="260" fill="#9aa4ad" font-family="Inter, Arial, sans-serif" font-size="11">100ms</text>
    <text x="322" y="260" fill="#9aa4ad" font-family="Inter, Arial, sans-serif" font-size="11">500ms</text>
  </g>

  <g transform="translate(492 230)">
    <rect width="444" height="282" rx="6" fill="#1f232a" stroke="#343a46"/>
    <text x="18" y="32" fill="#f4f5f5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Traffic by Status Code</text>
    <line x1="38" y1="238" x2="410" y2="238" stroke="#4b5563"/>
    <line x1="38" y1="58" x2="38" y2="238" stroke="#4b5563"/>
    <polyline points="42,210 96,180 150,170 204,126 258,136 312,92 406,72" fill="none" stroke="#73bf69" stroke-width="4"/>
    <polyline points="42,226 96,222 150,218 204,212 258,216 312,206 406,210" fill="none" stroke="#ff9830" stroke-width="4"/>
    <polyline points="42,236 96,236 150,234 204,236 258,235 312,236 406,235" fill="none" stroke="#f2495c" stroke-width="4"/>
    <circle cx="56" cy="260" r="5" fill="#73bf69"/>
    <text x="68" y="264" fill="#aeb6bf" font-family="Inter, Arial, sans-serif" font-size="12">2xx</text>
    <circle cx="116" cy="260" r="5" fill="#ff9830"/>
    <text x="128" y="264" fill="#aeb6bf" font-family="Inter, Arial, sans-serif" font-size="12">4xx / 429</text>
    <circle cx="206" cy="260" r="5" fill="#f2495c"/>
    <text x="218" y="264" fill="#aeb6bf" font-family="Inter, Arial, sans-serif" font-size="12">5xx</text>
  </g>
</svg>
