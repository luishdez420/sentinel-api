services:
  api:
    build: .
    container_name: rlapi_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-rlapi}:${POSTGRES_PASSWORD:-rlapi_password}@db:5432/${POSTGRES_DB:-rlapi}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16
    container_name: rlapi_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rlapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rlapi_password}
      POSTGRES_DB: ${POSTGRES_DB:-rlapi}
    ports:
      - "5433:5432"
    volumes:
      - rlapi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-rlapi} -d ${POSTGRES_DB:-rlapi}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: rlapi_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rlapi_pgdata:
